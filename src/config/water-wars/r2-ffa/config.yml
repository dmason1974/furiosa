# Water Wars R2: the 8 qualifiers on 1 map (4 per ocean).
# Free-for-all (battle royale): 4 teams share each ocean; the last 2 flagships in each ocean advance.
# Team names and players are placeholders until the live draw / results; paste real teams in then.
version: 5

event:
  key: "water-wars"
  name: "Water Wars - Round 2"
  round: 2
  teamSize: 5

countryPools:
  # Port-drafted pools reused from flagship-8team: each team in an ocean plays its own 5 countries.
  # Pacific ocean pools (ports 21 / 21 / 20 / 20)
  red:
    label: "Red"
    colour: "Red"
    playableCountries: [USA, Philippines, Venezuela, Argentina, Colombia]
    aiCountries: &pacificAi [Afghanistan, Bolivia, Kazakhstan, Mongolia, North Korea, Pakistan]
  orange:
    label: "Orange"
    colour: "Orange"
    playableCountries: [Brazil, Russia, Myanmar, Vietnam, South Korea]
    aiCountries: *pacificAi
  yellow:
    label: "Yellow"
    colour: "Yellow"
    playableCountries: [Indonesia, Australia, Chile, Thailand, India]
    aiCountries: *pacificAi
  green:
    label: "Green"
    colour: "Green"
    playableCountries: [Japan, China, Canada, Peru, Mexico]
    aiCountries: *pacificAi
  # Indo-Atlantic ocean pools (ports 17 / 16 / 16 / 16)
  blue:
    label: "Blue"
    colour: "Blue"
    playableCountries: [Sweden, Spain, Libya, Romania, Ukraine]
    aiCountries: &atlanticAi [Austria, Belarus, Iran, Iraq, Serbia, Syria]
  purple:
    label: "Purple"
    colour: "Purple"
    playableCountries: [United Kingdom, Italy, Egypt, Algeria, Israel]
    aiCountries: *atlanticAi
  brown:
    label: "Brown"
    colour: "Brown"
    playableCountries: [Norway, Turkey, Morocco, Ethiopia, Poland]
    aiCountries: *atlanticAi
  white:
    label: "White"
    colour: "White"
    playableCountries: [Greece, France, Finland, Germany, Saudi Arabia]
    aiCountries: *atlanticAi

maps:
  - mapNumber: 3
    theatres:
      - id: "A"
        name: "Pacific (free-for-all)"
        teams:
          - { teamName: "Qualifier 1", countryPool: red, players: [] }
          - { teamName: "Qualifier 2", countryPool: orange, players: [] }
          - { teamName: "Qualifier 3", countryPool: yellow, players: [] }
          - { teamName: "Qualifier 4", countryPool: green, players: [] }
      - id: "B"
        name: "Indo-Atlantic (free-for-all)"
        teams:
          - { teamName: "Qualifier 5", countryPool: blue, players: [] }
          - { teamName: "Qualifier 6", countryPool: purple, players: [] }
          - { teamName: "Qualifier 7", countryPool: brown, players: [] }
          - { teamName: "Qualifier 8", countryPool: white, players: [] }
