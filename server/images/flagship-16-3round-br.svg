<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="768" height="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="960" height="700" rx="18" fill="#141b2b"/>

  <text x="560" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">FLAGSHIP ROUND — 16 TEAMS</text>
  <text x="560" y="86" text-anchor="middle" font-size="12" fill="#8a94a6">3 rounds · 4 maps · battle royale throughout</text>

  <!-- Round labels -->
  <text x="40" y="168" font-size="13" font-weight="700" fill="#f5a623">ROUND 1</text>
  <text x="40" y="186" font-size="10" fill="#8a94a6">16 → 8 · 2 maps · BR</text>
  <text x="40" y="383" font-size="13" font-weight="700" fill="#f5a623">ROUND 2</text>
  <text x="40" y="401" font-size="10" fill="#8a94a6">8 → 4 · 1 map · BR</text>
  <text x="40" y="546" font-size="13" font-weight="700" fill="#f5a623">FINAL</text>
  <text x="40" y="564" font-size="10" fill="#8a94a6">4 → 1 · 1 map · BR</text>

  <!-- Connectors (drawn first, under the boxes) -->
  <g fill="none" stroke="#1fb5c4" stroke-width="2">
    <path d="M380 250 V300 H560 V330"/>
    <path d="M740 250 V300 H560"/>
    <path d="M560 440 V490"/>
  </g>

  <!-- Round 1: map 1 -->
  <rect x="230" y="120" width="300" height="130" rx="8" fill="#1b2436" stroke="#2c3b52" stroke-width="1.5"/>
  <text x="380" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MAP 1 · 8 teams</text>
  <rect x="246" y="161" width="12" height="12" rx="2" fill="#22c3d0"/>
  <text x="266" y="172" font-size="12" fill="#cfd6e4">Pacific FFA: Teams 1–4</text>
  <rect x="246" y="187" width="12" height="12" rx="2" fill="#f5a623"/>
  <text x="266" y="198" font-size="12" fill="#cfd6e4">Indo-Atlantic FFA: Teams 5–8</text>
  <text x="380" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#22c3d0">Last 2 flagships per ocean → 4 advance</text>

  <!-- Round 1: map 2 -->
  <rect x="590" y="120" width="300" height="130" rx="8" fill="#1b2436" stroke="#2c3b52" stroke-width="1.5"/>
  <text x="740" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MAP 2 · 8 teams</text>
  <rect x="606" y="161" width="12" height="12" rx="2" fill="#22c3d0"/>
  <text x="626" y="172" font-size="12" fill="#cfd6e4">Pacific FFA: Teams 9–12</text>
  <rect x="606" y="187" width="12" height="12" rx="2" fill="#f5a623"/>
  <text x="626" y="198" font-size="12" fill="#cfd6e4">Indo-Atlantic FFA: Teams 13–16</text>
  <text x="740" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#22c3d0">Last 2 flagships per ocean → 4 advance</text>

  <!-- Round 2 -->
  <rect x="410" y="330" width="300" height="110" rx="8" fill="#1b2436" stroke="#2c3b52" stroke-width="1.5"/>
  <text x="560" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MAP 3 · 8 teams</text>
  <text x="560" y="388" text-anchor="middle" font-size="12" fill="#cfd6e4">Battle royale · all 8 teams</text>
  <text x="560" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#22c3d0">4 advance</text>

  <!-- Final -->
  <rect x="410" y="490" width="300" height="110" rx="8" fill="#2b2108" stroke="#c8861a" stroke-width="2"/>
  <text x="560" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#f5b942">MAP 4 · GRAND FINAL</text>
  <text x="560" y="548" text-anchor="middle" font-size="12" fill="#e8d9b0">4 teams · battle royale</text>
  <text x="560" y="580" text-anchor="middle" font-size="15" font-weight="700" fill="#f5b942">★ CHAMPION</text>

  <!-- Legend -->
  <rect x="230" y="646" width="10" height="10" rx="2" fill="#22c3d0"/>
  <text x="248" y="655" font-size="11" fill="#8a94a6">Pacific theatre</text>
  <rect x="350" y="646" width="10" height="10" rx="2" fill="#f5a623"/>
  <text x="368" y="655" font-size="11" fill="#8a94a6">Indo-Atlantic theatre</text>
  <text x="890" y="655" text-anchor="end" font-size="11" fill="#8a94a6">BR in every round · theatre split shown in round 1</text>
</svg>
